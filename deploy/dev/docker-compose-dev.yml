services:
  mysql:
    image: mysql:8.0
    container_name: sejong-life-mysql
    hostname: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: sejong_life_db
      TZ: Asia/Seoul
    # dev 서버(RAM 2GB)에서 MySQL 메모리 사용량 제한
    command: --innodb-buffer-pool-size=128M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sejong-life-redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  app:
    container_name: sejong-life-app
    image: sejonglife/sejong-life:dev
    restart: unless-stopped
    volumes:
      - ./application.yml:/app/config/application.yml
      - log-data:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    ports:
      - "8080:8080"
      # 관리 포트(액추에이터)는 서버 내부에서만 접근 (헬스체크용)
      - "127.0.0.1:9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
  log-data:
