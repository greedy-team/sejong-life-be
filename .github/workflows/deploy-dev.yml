name: Deploy dev Server

on:
  push:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17.0.12'
          distribution: 'temurin'

      - name: gradlew 실행 권한 설정
        run: chmod +x ./gradlew

      - name: MySQL & Redis 컨테이너 실행
        run: docker compose up -d --wait
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: 빌드 및 테스트 실행
        run: |
          ./gradlew build --stacktrace
        env:
          SPRING_APPLICATION_NAME: sejong-life-be
          SPRING_PROFILES_ACTIVE: default

          SPRING_DATASOURCE_DRIVER-CLASS-NAME: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3308/sejong_life_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
          SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
          SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: true

          JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          JWT_EXPIRATION: 3600000
          JWT_SIGNUP_EXPIRATION: 600000

          CLOUD_AWS_S3_BUCKET: dev-sejong-life-bucket
          CLOUD_AWS_REGION_STATIC: ap-northeast-2

          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: 컨테이너 종료
        if: always()
        run: docker compose down

      - name: 도커 설정
        uses: docker/setup-buildx-action@v3

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESSTOKEN }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: sejonglife/sejong-life:dev

      - name: 도커 컴포즈 파일 서버 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_DEV_USERNAME }}
          key: ${{ secrets.GCP_DEV_SSH_KEY }}
          source: "deploy/dev/docker-compose-dev.yml,deploy/dev/deploy.sh"
          strip_components: 2
          target: "~"


  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: 도커 컨테이너 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_DEV_HOST }}
          username: ${{ secrets.GCP_DEV_USERNAME }}
          key: ${{ secrets.GCP_DEV_SSH_KEY }}
          script: |
            cd ~
            chmod +x deploy.sh
            # DB 비밀번호, AWS 키 등 서버 전용 비밀값은 서버의 ~/.env에서 컴포즈가 읽음
            export NAVER_CLIENT_ID='${{ secrets.NAVER_CLIENT_ID }}'
            export NAVER_CLIENT_SECRET='${{ secrets.NAVER_CLIENT_SECRET }}'
            export KAKAO_REST_API_KEY='${{ secrets.KAKAO_REST_API_KEY }}'
            export GOOGLE_MAPS_API_KEY='${{ secrets.GOOGLE_MAPS_API_KEY }}'
            ./deploy.sh
